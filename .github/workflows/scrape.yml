name: Scrape jobs_log counts

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # lets you run it manually to test

permissions:
  contents: write             # needed so the Action can commit count.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run scraper
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          APP_UID:  ${{ secrets.APP_UID }}
          APP_PWD:  ${{ secrets.APP_PWD }}
        run: python scrape.py

      - name: Commit count.json
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add count.json
          git diff --staged --quiet || git commit -m "Update counts"
          git push
